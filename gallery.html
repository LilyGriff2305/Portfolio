<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery</title>
<style>
:root{
  --bg:#F3F4F6; --ink:#16191F; --muted:#5E6573; --overlay:rgba(14,18,26,.88); --overlay-ink:#fff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F1218; --ink:#ECEFF4; --muted:#9AA3B2; --overlay:rgba(0,0,0,.85);}
}
:root[data-theme="dark"]{--bg:#0F1218; --ink:#ECEFF4; --muted:#9AA3B2; --overlay:rgba(0,0,0,.85);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:90rem;margin:0 auto;padding:2rem 1.25rem 4rem}
h1{font-size:clamp(2rem,6vw,3.25rem);letter-spacing:-.03em;margin:0 0 .25rem}
.sub{color:var(--muted);margin:0 0 2rem}
/* Back button */
.back{display:inline-flex;align-items:center;gap:.4rem;margin:0 0 1.5rem;padding:.5rem 1rem;border:1px solid var(--muted);border-radius:2rem;color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem;transition:background .2s ease}
.back:hover{background:var(--ink);color:var(--bg)}
.back:focus-visible{outline:3px solid #7F93FF;outline-offset:3px}

.gallery{columns:3;column-gap:1.5rem}
.item{position:relative;margin:0 0 1.5rem;break-inside:avoid;overflow:hidden;border-radius:.5rem;cursor:pointer;background:#000}
.item img{display:block;width:100%;height:auto}

/* 2 columns on tablets */
@media (max-width:60rem){
  .gallery{columns:2}
}
/* 1 column on phones */
@media (max-width:36rem){
  .gallery{columns:1}
}

/* Overlay: invisible by default, fades in on hover or keyboard focus */
.info{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:1.25rem;background:var(--overlay);color:var(--overlay-ink);
  opacity:0;transition:opacity .3s ease;
}
.item:hover .info,
.item:focus-visible .info,
.item:focus-within .info{opacity:1}
.item:focus-visible{outline:3px solid #7F93FF;outline-offset:3px}
.info h2{margin:0 0 .25rem;font-size:1.2rem}
.info p{margin:0;font-size:.9rem;opacity:.85}
.info .meta{margin-top:.6rem;font-size:.8rem;opacity:.7}
@media (prefers-reduced-motion:reduce){.info{transition:none}}

/* Lightbox */
.lightbox{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:2rem;background:rgba(0,0,0,.9)}
.lightbox[hidden]{display:none}
.lb-content{display:flex;width:min(100%,72rem);height:min(100%,44rem);background:var(--bg);border-radius:.5rem;overflow:hidden}
.lb-image{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;background:#000}
.lb-image img{max-width:100%;max-height:100%;object-fit:contain}
.lb-text{flex:0 0 22rem;padding:1.5rem;overflow-y:auto;border-left:1px solid var(--muted)}
.lb-text h2{margin:0 0 .75rem;font-size:1.4rem}
.lb-text p{margin:0 0 1rem;color:var(--ink)}
.lb-meta{color:var(--muted);font-size:.9rem}
.lb-close{position:absolute;top:.75rem;right:1.25rem;background:none;border:0;color:#fff;font-size:2.5rem;line-height:1;cursor:pointer}
.lb-close:focus-visible{outline:3px solid #7F93FF;outline-offset:3px}

/* Phones: stack the text under the image */
@media (max-width:48rem){
  .lightbox{padding:0}
  .lb-content{flex-direction:column;height:100%;border-radius:0}
  .lb-text{flex:0 0 auto;max-height:40%;border-left:0;border-top:1px solid var(--muted)}
}
</style>
</head>
<body>
<div class="wrap">
    <a class="back" href="index.html" onclick="if (history.length > 1) { history.back(); return false; }">&larr; Back</a>
  <h1>Gallery</h1>
  <p class="sub">Hover over an image (or tap it) to see the details.</p>

  <div class="gallery">
    <!-- To use real photos, replace each src with your image path, e.g. src="images/photo1.jpg" -->
    <figure class="item" tabindex="0">
      <img alt="Montreal Townhouses on Fire" src="imgs/montreal_townhouses.png">
      <figcaption class="info">
        <h2>It's Closer to Home Than You Think</h2>
        <p>A school project focusing on anti-complacency.</p>
        <span class="meta">Montreal, Canada · 2025</span>
      </figcaption>
    </figure>

    <figure class="item" tabindex="0">
      <img alt="Fish Pinup" src="imgs/fish_pinup.png">
      <figcaption class="info">
        <h2>Fish Pinup</h2>
        <p>A fun twist on a 1950s pinup with a fish head.</p>
        <span class="meta">Toronto, Canada · 2024 · 50mm f/1.8</span>
      </figcaption>
    </figure>

    <figure class="item" tabindex="0">
      <img alt="Leather Couch Blender 1" src="imgs/couch-blender-1.png">
      <figcaption class="info">
        <h2>Brown Leather Couch Blender 1</h2>
            <p>A 3D render of a brown leather couch made using low-poly, hard surface techniques in blender.</p>
        <span class="meta">Montreal, Canada · 2026</span>
      </figcaption>
    </figure>
    <figure class="item" tabindex="0">
      <img alt="Leather Couch Blender 2" src="imgs/couch-blender-2.png">
      <figcaption class="info">
        <h2>Brown Leather Couch Blender 2</h2>
            <p>A 3D render of a brown leather couch made using low-poly, hard surface techniques in blender.</p>
        <span class="meta">Montreal, Canada · 2026</span>
      </figcaption>
    </figure>

    <figure class="item" tabindex="0">
      <img alt="Album Cover Art" src="imgs/hands_album_cover.png">
      <figcaption class="info">
        <h2>Album Cover Art</h2>
            <p>A remade album cover inspired by "Ancient Dreams in a Modern Land" by MARINA.</p>
        <span class="meta">Montreal, Canada · 2023</span>
      </figcaption>
    </figure>

   
  </div>
</div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-title" hidden>
  <button class="lb-close" id="lb-close" aria-label="Close">&times;</button>
  <div class="lb-content">
    <div class="lb-image"><img id="lb-img" alt=""></div>
    <aside class="lb-text">
      <h2 id="lb-title"></h2>
      <p id="lb-desc"></p>
      <span class="lb-meta" id="lb-meta"></span>
    </aside>
  </div>
</div>
<script>
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbTitle = document.getElementById('lb-title');
const lbDesc = document.getElementById('lb-desc');
const lbMeta = document.getElementById('lb-meta');
const lbClose = document.getElementById('lb-close');
let lastFocused = null;

function openLightbox(item) {
  const img = item.querySelector('img');
  lbImg.src = img.src;
  lbImg.alt = img.alt;
  lbTitle.textContent = item.querySelector('h2').textContent;
  lbDesc.textContent = item.querySelector('p').textContent;
  lbMeta.textContent = item.querySelector('.meta').textContent;
  lastFocused = item;
  lb.hidden = false;
  document.body.style.overflow = 'hidden';
  lbClose.focus();
}

function closeLightbox() {
  lb.hidden = true;
  document.body.style.overflow = '';
  if (lastFocused) lastFocused.focus();
}

document.querySelectorAll('.item').forEach(item => {
  item.addEventListener('click', () => openLightbox(item));
  item.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openLightbox(item);
    }
  });
});

lbClose.addEventListener('click', closeLightbox);
lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !lb.hidden) closeLightbox(); });
</script>
</body>
</html>
